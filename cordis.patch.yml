# Bundle patch for dsh-plugin-strata.
# Enable it by adding this bundle to the profile's `dsh.profile.bundles`
# (Web sidebar → Plugins), or by deleting `disabled: true` below.
#
# Layer 1: the plugin row itself (monitor + hop control tools).
# Layer 2: the dsh provider entry that routes chats to the hop router.
# Model ids below MUST match the keys in ~/.config/strata/strata-hop.json,
# otherwise the hop router cannot resolve the request.
- insert:
    - id: dsh-plugin-strata
      name: 'dsh-plugin-strata'
      disabled: false
      config:
        hopUrl: http://127.0.0.1:8080
        port: 8756  # 客户端芯片硬编码连接 :8756，勿改
        host: 0.0.0.0  # 芯片走 window.location.hostname:8756；只绑 127.0.0.1 时，用 http://192.168.x.y:3080 打开 GUI 的浏览器连不上芯片。
        # 不想把 :8756 暴露给局域网就改回 127.0.0.1，然后本机用 http://127.0.0.1:3080 打开 GUI。
        followJournal: true
- id: llm-pi-ai
  config:
    providers:
      strata:
        displayName: 本地 Strata
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        apiKeyEnv: STRATA_API_KEY
        defaultContextWindow: 131072
        defaultMaxTokens: 16384
        models:
          - id: qwen3.8-flash-next-iq3_s
            name: 本地 IQ3_S (128K)
            contextWindow: 131072
            maxTokens: 16384
            # dsh 聊天设置里的 Effort 行：选了就把对应值作为 reasoning_effort 随请求发出，
            # 没选则用 strata「聊天设置」里的思考档位默认（见调参面板）。
            reasoningEfforts:
              off: none
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: high
              max: high
          - id: qwen3.8-flash-next-uncensored-iq3m
            name: 本地 IQ3_M 无审查 (128K)
            contextWindow: 131072
            maxTokens: 16384
            reasoningEfforts:
              off: none
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: high
              max: high
